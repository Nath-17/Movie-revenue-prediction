[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-revenue-prediction"
version = "0.1.0"
description = "Movie revenue prediction project"
requires-python = ">=3.10"
dependencies = [
	"numpy",
	"pandas",
	"scikit-learn",
	"PyYAML",
	"xgboost",
	"catboost",
	"optuna",
	"mlflow",
	"streamlit",
    "logging",
]

[project.optional-dependencies]
dev = [
	"pytest",
	"jupyter",
	"ipykernel",
	"ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
