models:
  linear_regression:
    type: linear
    parameters:
      fit_intercept: true
      normalize: false
    grid_parameters:
      fit_intercept: [true, false]
      normalize: [true, false]
  random_forest_regressor:
    type: ensemble
    parameters:
      n_estimators: 100
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
    grid_parameters:
      n_estimators: [100, 200, 300]
      max_depth: [null, 5, 10]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
  xgboost:
    type: gradient_boosting
    parameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      subsample: 1.0
      colsample_bytree: 1.0
    grid_parameters:
      n_estimators: [100, 200, 300]
      learning_rate: [0.01, 0.1, 0.2]
      max_depth: [3, 5, 7]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.8, 1.0]
  catboost:
    type: gradient_boosting
    parameters:
      iterations: 1000
      learning_rate: 0.1
      depth: 6
      l2_leaf_reg: 3
      border_count: 32
    grid_parameters:
      iterations: [500, 1000, 1500]
      learning_rate: [0.01, 0.1, 0.2]
      depth: [4, 6, 8]
      l2_leaf_reg: [1, 3, 5]
      border_count: [32, 64, 128]